<!DOCTYPE html>
<html>

<head>
    <title>Pierce Stats</title>
    <style>
        .ear-container {
            position: relative;
            display: inline-block;
            width: 350px;
            height: 350px;
            vertical-align: top;
        }

        .ear-container img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ear-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .ear-overlay circle {
            fill: rgba(0, 0, 0, 0.35);
            stroke: rgb(0, 0, 0);
            stroke-width: 3;
            cursor: pointer;
        }

        .ear-overlay circle:hover {
            fill: rgba(39, 22, 189, 0.7);
        }

        #infodiv {
            white-space: pre-line;
            background-color: rgb(49, 248, 255);
            min-height: 100px;
            margin-bottom: 20px;
            overflow-wrap: anywhere;
        }

        #info {
            font-size: 100px;
        }

        #jsonUpload {
            display: block;
            margin-top: 20px;
        }
    </style>

</head>

<body>
    <div class="ear-container">
        <img src="left_ear.png" alt="Left ear">

        <svg class="ear-overlay" viewBox="0 0 350 350">
            <circle cx="230" cy="300" r="18" onclick="writee('infoprimulst')" />

            <circle cx="197" cy="278" r="18" onclick="writee('infoaldoileast')" />
        </svg>
    </div>

    <div class="ear-container">
        <img src="right_ear.png" alt="Right ear">

        <svg class="ear-overlay" viewBox="0 0 350 350">
            <circle cx="127" cy="300" r="18" onclick="writee('infoprimuldr')" />

            <circle cx="157" cy="257" r="18" onclick="writee('infoaldoileadr')" />
        </svg>
    </div>
    <div id="infodiv">
        <p id="info">hi</p>
    </div>
    <input type="file" id="jsonUpload" accept=".json,application/json">
    <script>
        let files = {};
        let filesLoaded = false;
        let selected_id;

        document.getElementById("jsonUpload").addEventListener("change", async function (event) {
            const file = event.target.files[0];

            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                if (typeof data !== "object" || data === null || Array.isArray(data)) {
                    throw new Error("JSON must contain an object with piercing IDs.");
                }

                files = data;
                filesLoaded = true;

                console.log("Uploaded JSON:", files);
                alert("JSON loaded successfully!");

                // Refresh the displayed information if a piercing is selected
                if (selected_id) {
                    writee(selected_id);
                }
            } catch (error) {
                console.error("Failed to load JSON:", error);
                alert("Invalid JSON file!");
            }

            event.target.value = "";
        });

        function writee(id) {
            if (!filesLoaded) {
                alert("Upload your JSON file first!");
                return;
            }

            const pierce = files[id];

            if (!pierce) {
                console.error("ID not found:", id);
                return;
            }

            document.getElementById("infodiv").style.display = "block";
            const lastDate = pierce.date[pierce.date.length - 1];
            const [size, dateStr] = lastDate.split("_");

            const [day, month, year] = dateStr.split(".").map(Number);

            // Build dates using UTC to avoid timezone issues
            const startDate = new Date(Date.UTC(year, month - 1, day));
            const today = new Date();

            const todayUTC = Date.UTC(
                today.getFullYear(),
                today.getMonth(),
                today.getDate()
            );

            const timeWorn = Math.round(
                (todayUTC - startDate.getTime()) / (1000 * 60 * 60 * 24)
            );

            document.getElementById("info").textContent =
                `${pierce.name}\nDate: ${pierce.date.join(", ")}\nSize: ${pierce.size}\nTime worn: ${timeWorn} days`;

            selected_id = id;
        }
    </script>
</body>

</html>
