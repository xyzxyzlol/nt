<!DOCTYPE html>
<html>

<head>
    <title>Pierce Stats</title>
    <link rel="stylesheet" href="index.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <div class="ear-container">
        <img src="left_ear.png" alt="Left ear">

        <svg class="ear-overlay" viewBox="0 0 350 350">
            <circle cx="230" cy="300" r="18"
                onclick="writee('infoprimulst')" />

            <circle cx="197" cy="278" r="18"
                onclick="writee('infoaldoileast')" />
        </svg>
    </div>

    <div class="ear-container">
        <img src="right_ear.png" alt="Right ear">

        <svg class="ear-overlay" viewBox="0 0 350 350">
            <circle cx="127" cy="300" r="18"
                onclick="writee('infoprimuldr')" />

            <circle cx="157" cy="257" r="18"
                onclick="writee('infoaldoileadr')" />
        </svg>
    </div>

    <div id="infodiv">
        <p id="info">hi</p>

        <div id="dateControls" style="display: none;">
            <label for="newDate">
                <strong>submit date?</strong>
            </label>

            <br>

            <input
                type="text"
                id="newDate"
                placeholder="e.g. 1.6mm_23.10.2026"
            >

            <br>

            <button type="button" onclick="addDate()">
                Add date
            </button>
        </div>

        <p id="status"></p>
    </div>

    <input
        type="file"
        id="jsonUpload"
        accept=".json,application/json"
    >

    <button
        type="button"
        id="downloadButton"
        onclick="downloadJSON()"
        disabled
    >
        Download updated JSON
    </button>

    <script>
        let files = {};
        let filesLoaded = false;
        let selected_id = null;

        const infoElement = document.getElementById("info");
        const statusElement = document.getElementById("status");
        const dateControls = document.getElementById("dateControls");
        const newDateInput = document.getElementById("newDate");
        const downloadButton = document.getElementById("downloadButton");

        // Upload JSON
        document.getElementById("jsonUpload").addEventListener(
            "change",
            async function (event) {
                const file = event.target.files[0];

                if (!file) return;

                const text = await file.text();
                files = JSON.parse(text);
                filesLoaded = true;

                downloadButton.disabled = false;

                alert("loaded");

                if (selected_id) {
                    writee(selected_id);
                } else {
                    infoElement.textContent = "hi";
                    dateControls.style.display = "none";
                }

                event.target.value = "";
            }
        );

        // Display information for the selected piercing.
        function writee(id) {
            if (!filesLoaded) {
                alert("Upload your JSON file first!");
                return;
            }

            const pierce = files[id];

            selected_id = id;

            document.getElementById("infodiv").style.display = "block";
            dateControls.style.display = "block";

            newDateInput.value = "";
            statusElement.textContent = "";

            let timeWornText = "Unknown";

            if (pierce.date.length > 0) {
                const lastDate = pierce.date[pierce.date.length - 1];
                const parts = lastDate.split("_");
                const dateStr = parts[1];

                const [day, month, year] =
                    dateStr.split(".").map(Number);

                const startDate = new Date(
                    Date.UTC(year, month - 1, day)
                );

                const today = new Date();

                const todayUTC = Date.UTC(
                    today.getFullYear(),
                    today.getMonth(),
                    today.getDate()
                );

                const timeWorn = Math.round(
                    (todayUTC - startDate.getTime()) /
                    (1000 * 60 * 60 * 24)
                );

                timeWornText = timeWorn + " days";
            }

            infoElement.textContent =
                `${pierce.name || id}\n` +
                `Date: ${pierce.date.join(", ")}\n` +
                `Size: ${pierce.size ?? "Unknown"}\n` +
                `Time worn: ${timeWornText}`;
        }

        // Add a date to the selected piercing.
        function addDate() {
            const inputString = newDateInput.value.trim();

            files[selected_id].date.push(inputString);

            writee(selected_id);

            alert("added")

            newDateInput.value = "";
        }

        // Download the updated JSON.
        function downloadJSON() {
            const jsonString = JSON.stringify(files, null, 4);

            const blob = new Blob(
                [jsonString],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "pierce_stats.json";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

            alert("downloaded");
        }
    </script>

</body>
</html>
